name: Run Python

# Controls when the action will run. 
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/60 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: 'Set up Python'
        uses: actions/setup-python@v1
        with:
           python-version: 3.11
      - name: 'Install requirements'
        run: pip install requests
      - name: 'Working'
        run: 
          python main.py

      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update active nodes"
