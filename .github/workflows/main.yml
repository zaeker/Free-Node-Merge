name: Run Pythonname: Run Python

# 规范触发条件
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *' # 正确的每小时执行语法
  workflow_dispatch:

# 显式声明权限，防止 commit 失败
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 升级到 v4，告别废弃警告

      - name: Set up Python
        uses: actions/setup-python@v5 # 升级到 v5，速度更快更安全
        with:
           python-version: '3.11' # 加上引号避免 YAML 解析歧义

      - name: Install requirements
        run: pip install requests

      - name: Working
        run: python main.py

      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update active nodes"
